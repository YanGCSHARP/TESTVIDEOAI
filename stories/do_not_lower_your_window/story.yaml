# ----------------------------------------------------------------------------- S08
- id: S08
  title: "The crosswalk"
  hud: {time: "2:23 AM", miles_to_exit: 2.9}
  music: {state: drone, intensity: 0.35, drop_out_at: "7"}
  vo:
    - {t: "The woman was standing at a crosswalk."}
    - {t: "No umbrella. No coat. A pale sweater gone dark with rain, and her arms hanging straight at her sides."}
    - {t: "The walk signal in front of her was lit. She didn't walk."}
    - {t: "Daniel slowed, expecting her to step out in front of him. She didn't move."}
    - {t: "He waited three seconds."}
    - {t: "Then he tapped the horn."}
    - {t: "Her head turned toward the cab.", p: 0.9}
    - {t: "At the same instant, behind the window of a laundromat across the street, someone else turned."}
    - {t: "So did a figure under the bus shelter. A figure Daniel had looked straight at and taken for a shadow."}
    - {t: "None of them raised a hand."}
    - {t: "All three watched the truck go by.", p: 0.8}
  shots:
    - {id: S08_A, covers: [1, 2], framing: "medium, from cab", camera: "slow approach", refs: [WOMAN],
       prompt: "a woman standing motionless at a lit crosswalk in the rain, cream sweater soaked dark, arms straight down, face turned away"}
    - {id: S08_B, covers: [3, 3], framing: "insert", camera: "locked", refs: [],
       prompt: "a pedestrian signal showing the white walking-person symbol, rain streaking past it"}
    - {id: S08_C, covers: [4, 6], framing: "close-up", camera: "locked", refs: [DANIEL, TRUCK],
       prompt: "Daniel's hand moving to the center of the steering wheel horn pad, eyes on the woman"}
    - {id: S08_D, covers: [7, 7], framing: "medium", camera: "locked", refs: [WOMAN],
       prompt: "the woman's head turns toward camera, face still in deep shadow under wet hair, no features visible"}
    - {id: S08_E, covers: [8, 8], framing: "wide across street", camera: "slow rack focus", refs: [],
       prompt: "a dim laundromat window with a still silhouette inside turning toward the street"}
    - {id: S08_F, covers: [9, 11], framing: "wide", camera: "tracking with truck", refs: [TRUCK],
       prompt: "a bus shelter with a dark standing figure, the truck passes in the foreground, the figure's head follows it"}
  sfx:
