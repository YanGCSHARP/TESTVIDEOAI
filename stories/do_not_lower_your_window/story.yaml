# ----------------------------------------------------------------------------- S13
- id: S13
  title: "Step one"
  hud: {time: "2:41 AM", miles_to_exit: 0.4}
  music: {state: drone_low, intensity: 0.35}
  vo:
    - {t: "The man walked to the driver's side and stopped beside the door."}
    - {t: "White coveralls. Clear goggles. A white mask pulled tight across his mouth and nose."}
    - {t: "He lifted his hand and pointed down at the window.", p: 0.8}
    - {t: "Driver window down. Step one."}
    - {t: "Daniel's hand was already moving toward the switch. Eleven years of habit moved it for him."}
    - {t: "Then he saw the glove.", p: 0.7}
    - {t: "The left index finger had torn through the blue nitrile. Under it, the finger bent sideways at the middle joint, and the man didn't seem to know."}
    - {t: "Daniel took his hand off the switch. He pointed at the gate instead."}
    - {t: "The man's eyes followed his hand."}
    - {t: "Then, patiently, he pointed down at the window again.", p: 0.9}
    - {t: "Rule four. An instruction is only as safe as the person giving it.", p: 1.0}
