# DO NOT LOWER YOUR WINDOW — production script, revision 2.
#
# How this file is read by code (tools/story_timeline.py):
#   * Each scene's `vo` is an ordered list of items. An item is either
#       {t: "<one sentence of narration>", p: <pause after, s>}   or   {beat: <seconds of silence>}
#     Items are numbered from 1 inside each scene.
#   * Every item is covered by exactly one shot: shot.covers = [first_item, last_item].
#     Shot duration = measured audio of those items (+ pauses/beats) + shot.hold.
#     Picture follows the voice, so there is never dead air and words are never cut.
#   * Anchors for overlays / sfx / music: "N" = start of item N, "Ne" = end of item N,
#     optional "+x" / "-x" offset in seconds, e.g. "4e+0.3".
#   * Text never appears inside generated images. Everything readable is an overlay.
#   * prompt = what the image/video model gets, after STYLE.prompt and the referenced
#     CONTINUITY descriptions are prepended. NEGATIVE applies to every shot.

project:
  title: "DO NOT LOWER YOUR WINDOW"
  language: en-US
  target_minutes: [11.5, 13.0]
  aspect: "16:9"
  resolution: [1920, 1080]
  fps: 30
  genre: "cinematic biological horror, slow burn"
  setting: "Bellwether, Pennsylvania (fictional town, pop. ~11,000), late October, 2:01–2:44 AM, light rain, thin ground fog"

narrator:
  voices: 1
  engine: kokoro            # offline; swap for a recorded or licensed voice later
  voice: am_onyx
  speed: 0.90
  default_pause: 0.45
  perspective: "third person, close on Daniel; documentary narrator who states numbered rules"
  delivery: "low, restrained, unhurried; no theatrics; slightly slower and quieter in S13–S17"
  dialogue: none            # no character ever speaks, no lip-sync anywhere

STYLE:
  prompt: >-
    cinematic illustrated realism, painterly digital matte painting, film still, 35mm anamorphic look,
    cold blue-gray night palette with muted sodium-amber practical lights, wet reflective asphalt,
    light rain, soft volumetric fog, shallow depth of field, restrained film grain, American small town
  negative: >-
    text, letters, words, numbers, logos, watermarks, signage with writing, license plate characters,
    speaking, open mouth talking, lip sync, glowing eyes, red eyes, monsters, mutations, tentacles,
    exposed organs, blood spray, gore, zombie crowd, explosions, military, soldiers, weapons,
    laboratory, daylight, snow, right-hand drive, steering wheel on the right, cartoon, anime, 3d render

CONTINUITY:
  DANIEL:
    desc: >-
      American man, 37, short dark-brown hair, light stubble, tired brown eyes, charcoal canvas work
      jacket over a faded navy t-shirt, dark jeans, no hat, no jewelry
    acting: "practical, observant; tension shown by stillness and breathing, never by screaming"
    rule: "always in the LEFT seat of the truck; never leaves the cab after S05; never lowers the window"
  TRUCK:
    desc: >-
      unbranded white 26-foot American box truck, cab-over-free conventional cab, black side mirrors,
      amber roof marker lights, rectangular white cargo box, roll-up rear door, no trailer, left-hand drive
    interior: >-
      dark gray dashboard, analog gauges, phone in a dash mount right of the steering wheel,
      paper coffee cup in holder (empty), power window switch on the driver door armrest
    rule: "never breaks down; engine runs from S05 to the end"
  FUEL:
    desc: >-
      small American roadside gas station, four pumps under a faded red-and-white canopy,
      attached convenience store with bright fluorescent interior, wet concrete apron, empty at night
  SEDAN:
    desc: "older dark-blue four-door sedan at the nearest pump, driver door open, driver window fully down, headlights off, dome light on"
  WOMAN:
    desc: >-
      woman, about 40, shoulder-length wet brown hair, pale cream knit sweater soaked dark by rain,
      gray slacks, no coat, arms hanging straight, face kept in shadow or turned away
  VAN:
    desc: "white county health department utility van with blank panels, parked at an angle, both rear doors open"
  CHECKPOINT:
    desc: >-
      temporary roadblock at the east edge of town: two portable light towers with floodlights,
      concrete jersey barriers funneling two lanes into one, a striped lowered gate arm, a white
      utility van and a dark SUV behind the gate with doors open, a folding table under the lights,
      a wide gravel turnout in front of the barriers, temporary road sign on steel legs facing away
  WORKER:
    desc: >-
      adult man in an off-white disposable protective coverall, hood down, clear goggles,
      white respirator-style mask, blue nitrile gloves, left glove torn across the index finger
    reveal: >-
      (S14 onward only) clouded milky eyes, thin dark branching discoloration on the neck,
      dark stain spreading from the center of the mask, jaw hanging slightly crooked; no wounds, no blood

OVERLAY_STYLES:
  marker:   {font: "Permanent Marker or similar hand font", color: "#111111", on: "white panel", jitter: true}
  printed:  {font: "Inter Bold", color: "#111111", on: "white panel"}
  phone:    {font: "Inter SemiBold", color: "#FFFFFF", on: "phone screen UI"}
  title:    {font: "Inter Black", color: "#F2F2F2", tracking: 0.08}
  rule:     {font: "Inter ExtraBold", color: "#F2F2F2", accent: "#C0392B", layout: "lower-left card: 'RULE 2' small red label above the rule text", in: "fade+slide 0.4s", out: "fade 0.4s"}
  hud:      {font: "Inter SemiBold", color: "#DDE6EC", layout: "lower-right: time, and 'MI TO EXIT' when set", size: 30}

# Sound vocabulary used by the cues below (all can be synthesized or taken from a licensed library).
SFX_LIBRARY: [engine_idle_cab, engine_rev, tires_wet, rain_on_roof, rain_outside, wipers, radio_low_instrumental,
  door_chime_loop, canopy_hum, truck_door_close, store_fridges, phone_buzz_counter, scrape_door, soup_can_roll,
  handle_strain, door_lock_thunk, hazard_tick, call_drop_tone, horn_tap, radio_click_off, van_door_creak,
  fence_drag, fence_clatter, boxes_shift, generator_hum, coverall_rustle, phone_ring_mount, handle_pull,
  backup_alarm_loop, palm_hit_glass, mirror_rattle, window_drop_clunk, rain_gust_inside, window_motor_whine]

MUSIC:
  palette: "low synth drone in D minor, sparse felt piano notes, sub pulse at 60 BPM only when stated; never melodic heroics"
  rule: "music fully drops out for S08 item 7 to S09 item 3, and for the last 4 s of S16"

scenes:

# ----------------------------------------------------------------------------- S00
- id: S00
  title: "Cold open"
  hud: null
  music: {state: drone, intensity: 0.25}
  vo:
    - {t: "There is a gesture every truck driver in America knows."}
    - {t: "A hand raised beside the cab. Then one finger, pointing down."}
    - {t: "Lower your window.", p: 0.9}
    - {t: "Daniel Reed had answered that gesture at weigh stations, toll plazas and loading docks for eleven years."}
    - {t: "It had never cost him more than a few seconds."}
    - {t: "At two forty-one in the morning, at the eastern edge of Bellwether, Pennsylvania, a man in a protective suit made that gesture again."}
    - {t: "And for the first time in his life, Daniel kept his hand on the wheel.", p: 0.8}
    - {beat: 3.0}
  shots:
    - {id: S00_A, covers: [1, 1], framing: "extreme close-up", camera: "slow push-in", refs: [WORKER],
       prompt: "a blue-gloved hand rises into frame beside a truck door, floodlight glare behind it, rain streaks, face out of frame"}
    - {id: S00_B, covers: [2, 3], framing: "close-up through driver window", camera: "locked, rain drifts", refs: [WORKER, TRUCK],
       prompt: "the gloved index finger points down at the closed driver window, seen from inside the dark cab, raindrops on glass"}
    - {id: S00_C, covers: [4, 5], framing: "medium montage", camera: "slow lateral drift", refs: [DANIEL, TRUCK],
       prompt: "daytime memory tone but still muted: Daniel in the cab at a highway weigh station, window down, arm resting on the door, bored and calm"}
    - {id: S00_D, covers: [6, 6], framing: "wide", camera: "very slow push-in", refs: [CHECKPOINT, TRUCK, WORKER],
       prompt: "the white box truck stopped before a floodlit roadblock, a lone figure in a white protective suit beside the driver door, night rain"}
    - {id: S00_E, covers: [7, 7], framing: "extreme close-up", camera: "locked", refs: [DANIEL],
       prompt: "Daniel's hand gripping the steering wheel, knuckles pale, his other hand hovering away from the window switch"}
    - {id: S00_F, covers: [8, 8], framing: "black", camera: "none", refs: [],
       prompt: "solid black frame"}
  overlays:
    - {style: title, text: "DO NOT LOWER YOUR WINDOW", in: "8+0.2", out: "8e", fx: "typewriter 0.06 s/char, hard cut out"}
  sfx:
    - {cue: generator_hum, in: "1", out: "3e"}
    - {cue: rain_outside, in: "1", out: "7e"}
    - {cue: coverall_rustle, in: "2+0.3"}
    - {cue: engine_idle_cab, in: "6", out: "7e"}
    - {cue: window_motor_whine, in: "8+0.3", gain_db: -12, note: "only a fraction of a second, then silence: a tease of the ending"}

# ----------------------------------------------------------------------------- S01
- id: S01
  title: "An ordinary route"
  hud: {time: "2:01 AM"}
  music: {state: drone, intensity: 0.15}
  vo:
    - {t: "Forty minutes earlier, the night had been ordinary."}
    - {t: "Daniel had a twenty-six-foot box truck full of groceries, a delivery window that closed at five, and a dispatcher who only called when something went wrong."}
    - {t: "A jackknifed tractor-trailer had shut down the interstate, so the routing app sent him off the highway and through Bellwether, a town he had never had a reason to see."}
    - {t: "The detour added nineteen minutes. Nothing more."}
    - {t: "The radio played low. The wipers kept time with it."}
    - {t: "He had driven through smaller towns. He had driven through worse weather."}
    - {t: "Nothing on the screen beside the wheel suggested anything ahead of him but a two-lane road, a few closed businesses, and the long dark stretch back to the interstate.", p: 0.8}
  shots:
    - {id: S01_A, covers: [1, 1], framing: "aerial wide", camera: "slow drone track", refs: [TRUCK],
       prompt: "the white box truck alone on a wet two-lane road through Pennsylvania forest at night, headlights in fog"}
    - {id: S01_B, covers: [2, 2], framing: "medium, from passenger seat", camera: "subtle handheld sway", refs: [DANIEL, TRUCK],
       prompt: "Daniel driving, relaxed, empty paper coffee cup in holder, phone in dash mount glowing blue"}
    - {id: S01_C, covers: [3, 3], framing: "insert", camera: "slow push-in", refs: [TRUCK],
       prompt: "close-up of the phone in the dash mount showing a blank glowing navigation screen (route drawn as overlay later)"}
    - {id: S01_D, covers: [4, 5], framing: "through windshield", camera: "locked to cab", refs: [TRUCK],
       prompt: "view through the windshield, wipers mid-sweep, wet road and reflectors ahead, amber dashboard glow"}
    - {id: S01_E, covers: [6, 7], framing: "wide side tracking", camera: "parallel tracking", refs: [TRUCK],
       prompt: "the truck passing a dark closed roadside diner and a gravel lot, rain under a single streetlight"}
  overlays:
    - {style: phone, text: "ROUTE UPDATED · +19 MIN · via BELLWETHER", in: "3+1.0", out: "3e+0.5", anchor_shot: S01_C}
  sfx:
    - {cue: engine_idle_cab, in: "1", out: "7e"}
    - {cue: tires_wet, in: "1", out: "7e"}
    - {cue: wipers, in: "4", out: "7e"}
    - {cue: radio_low_instrumental, in: "1", out: "7e", gain_db: -20, note: "must continue under S02–S09 until the radio click in S09"}

# ----------------------------------------------------------------------------- S02
- id: S02
  title: "The sign"
  hud: {time: "2:05 AM"}
  music: {state: drone, intensity: 0.2}
  vo:
    - {t: "The sign stood just past the town limit."}
    - {t: "Temporary steel legs. A portable lamp clamped to the top. A white panel, the kind road crews use for lane closures."}
    - {t: "Someone had blacked out the printed message and written over it in thick marker, the letters large and uneven, pressed hard enough to tear the surface."}
    - {t: "Keep vehicle windows closed.", p: 0.9}
    - {t: "Daniel glanced at the window beside him. Already closed."}
    - {t: "Beyond the trees, the lights of a processing plant glowed in the mist. A chemical leak, he decided. A road crew with no time to print a proper sign."}
    - {t: "That was the first explanation of the night."}
    - {t: "It lasted about a minute."}
    - {t: "An ambulance came toward him in the other lane, emergency lights turning."}
    - {t: "Its siren was off.", p: 0.6}
    - {beat: 2.0}
  shots:
    - {id: S02_A, covers: [1, 2], framing: "wide from approaching cab", camera: "slow push as truck approaches", refs: [TRUCK],
       prompt: "a temporary road sign on steel legs at the roadside, lamp on top, blank white panel, rain in the lamp beam, forest edge"}
    - {id: S02_B, covers: [3, 4], framing: "close-up", camera: "slow pan across panel", refs: [],
       prompt: "close-up of the white panel, printed area scribbled over with heavy black marker strokes, surface torn in places, BLANK space where letters will be overlaid"}
    - {id: S02_C, covers: [5, 5], framing: "close-up", camera: "locked", refs: [DANIEL, TRUCK],
       prompt: "Daniel's eyes in the side window reflection, closed glass beaded with rain"}
    - {id: S02_D, covers: [6, 8], framing: "wide through side window", camera: "slow lateral drift", refs: [],
       prompt: "distant industrial processing plant lights through trees and mist, no smoke, no fire"}
    - {id: S02_E, covers: [9, 11], framing: "through windshield", camera: "locked", refs: [TRUCK],
       prompt: "an ambulance with flashing red-and-white emergency lights passes in the opposite lane, its cabin dark, then gone"}
  overlays:
    - {style: marker, text: "KEEP VEHICLE\nWINDOWS CLOSED", in: "3+1.2", out: "4e+0.6", anchor_shot: S02_B, note: "letters drawn on stroke by stroke"}
  sfx:
    - {cue: tires_wet, in: "1", out: "11e"}
    - {cue: tires_wet, in: "9", gain_db: 4, note: "passing vehicle swoosh, left-to-right, no siren"}

# ----------------------------------------------------------------------------- S03
- id: S03
  title: "The only lit building"
  hud: {time: "2:09 AM"}
  music: {state: drone, intensity: 0.2}
  vo:
    - {t: "Bellwether Fuel was the only lit building on Main Street."}
    - {t: "Four pumps under a red-and-white canopy. A convenience store with every light on. A blue sedan at the nearest pump."}
    - {t: "Daniel pulled in for coffee. Out of habit, he parked at the edge of the lot, nose toward the exit."}
    - {t: "The sedan's driver door stood open. The window was rolled all the way down, and the seat was dark with rain."}
    - {t: "The keys were still in the ignition. That was why the chime kept sounding. A soft, patient tone, repeating every second, for no one."}
    - {t: "He waited for the driver to come back out of the store."}
    - {t: "Nobody did."}
    - {t: "The driver was in the restroom, he told himself. It was a reasonable explanation."}
    - {t: "He would stop using that word soon.", p: 0.8}
  shots:
    - {id: S03_A, covers: [1, 2], framing: "wide establishing", camera: "slow push-in", refs: [FUEL, SEDAN],
       prompt: "the gas station glowing alone in the rainy dark street, blue sedan at the first pump"}
    - {id: S03_B, covers: [3, 3], framing: "high wide", camera: "locked", refs: [FUEL, TRUCK],
       prompt: "the white box truck parks at the far edge of the lot, front facing the exit, not at a pump"}
    - {id: S03_C, covers: [4, 4], framing: "medium", camera: "slow dolly along car", refs: [SEDAN],
       prompt: "the empty sedan, driver door open, window down, rain falling onto the dark wet seat, dome light on"}
    - {id: S03_D, covers: [5, 5], framing: "insert", camera: "locked", refs: [SEDAN],
       prompt: "keys hanging in the ignition, dashboard warning light blinking softly"}
    - {id: S03_E, covers: [6, 7], framing: "from inside cab", camera: "locked, wipers off", refs: [DANIEL, FUEL],
       prompt: "Daniel waits behind the wheel watching the bright store entrance, nobody comes out"}
    - {id: S03_F, covers: [8, 9], framing: "medium wide", camera: "camera stays outside, slow pull-back", refs: [DANIEL, FUEL],
       prompt: "Daniel crosses the wet apron toward the store entrance, seen from behind, the sedan in the foreground"}
  sfx:
    - {cue: engine_idle_cab, in: "1", out: "3e", note: "engine off at 3e"}
    - {cue: canopy_hum, in: "3e", out: "9e"}
    - {cue: door_chime_loop, in: "3e+0.4", out: "9e", note: "1 Hz chime, keeps going into S04 under the store ambience at -18 dB"}
    - {cue: truck_door_close, in: "8+0.5"}

# ----------------------------------------------------------------------------- S04
- id: S04
  title: "Unfinished work"
  hud: {time: "2:11 AM"}
  music: {state: drone, intensity: 0.3}
  vo:
    - {t: "Inside, the store smelled of burnt coffee and floor cleaner."}
    - {t: "A paper cup sat under the dispenser. Coffee had overflowed and was still dripping into the tray, which meant the machine had been started minutes ago, not hours."}
    - {t: "A carton of canned soup sat in the aisle, half unpacked."}
    - {t: "Behind the register, a phone lit up, buzzed against the counter, and went dark."}
    - {t: "Daniel looked toward the stockroom door."}
    - {t: "Something touched the other side of it."}
    - {t: "Not a knock.", p: 0.7}
    - {t: "A slow scrape, at the height of a man's shoulder. Then the soft pressure of weight settling against the wood.", p: 0.9}
  shots:
    - {id: S04_A, covers: [1, 2], framing: "close tracking", camera: "slow dolly along counter", refs: [FUEL],
       prompt: "coffee station inside the store, a paper cup under the dispenser, dark coffee overflowing into the drip tray, harsh fluorescent light"}
    - {id: S04_B, covers: [3, 3], framing: "low medium", camera: "locked", refs: [FUEL],
       prompt: "an open cardboard carton of soup cans half unpacked on the aisle floor, some cans on the shelf"}
    - {id: S04_C, covers: [4, 4], framing: "insert", camera: "locked", refs: [],
       prompt: "a smartphone face up on the counter behind the register, screen lit, then dark (caller info blank)"}
    - {id: S04_D, covers: [5, 6], framing: "over-the-shoulder", camera: "very slow push past Daniel", refs: [DANIEL, FUEL],
       prompt: "Daniel in the foreground, out of focus, a closed gray stockroom door at the back of the store in focus"}
    - {id: S04_E, covers: [7, 8], framing: "close-up", camera: "locked", refs: [],
       prompt: "the stockroom door, its surface flexing very slightly inward at shoulder height as weight leans on it from behind"}
  sfx:
    - {cue: store_fridges, in: "1", out: "8e"}
    - {cue: door_chime_loop, in: "1", out: "8e", gain_db: -18}
    - {cue: phone_buzz_counter, in: "4+0.4"}
    - {cue: scrape_door, in: "6+0.6"}
    - {cue: scrape_door, in: "8", gain_db: -3}

# ----------------------------------------------------------------------------- S05
- id: S05
  title: "The handle"
  hud: {time: "2:13 AM"}
  music: {state: drone_rising, intensity: 0.45}
  vo:
    - {t: "Under the door, in the strip of light from the stockroom, he could see the shadows of two feet. Standing close. Not moving."}
    - {t: "Daniel took one step back."}
    - {t: "His heel hit the soup carton. A can rolled across the floor and stopped against the counter."}
    - {t: "The scrape stopped.", p: 0.9}
    - {t: "Then the handle began to turn. Slowly, all the way to the end of its travel."}
    - {t: "Whoever stood behind it kept turning, as if the handle might give a little more."}
    - {t: "Daniel left without the coffee."}
    - {t: "In the cab, he locked both doors before he started the engine."}
    - {t: "In his mirror, the store entrance swung open."}
    - {t: "He turned onto the road before he could see who walked out.", p: 0.7}
    - {t: "Rule one. A lit building is not an open building.", p: 1.0}
  shots:
    - {id: S05_A, covers: [1, 1], framing: "floor-level close-up", camera: "locked", refs: [],
       prompt: "gap under a closed door, bright light behind it, the shadows of two feet standing still"}
    - {id: S05_B, covers: [2, 4], framing: "low angle", camera: "locked", refs: [DANIEL],
       prompt: "Daniel's work boot steps back and knocks a soup can, which rolls across the tile floor"}
    - {id: S05_C, covers: [5, 6], framing: "extreme close-up", camera: "slow push-in", refs: [],
       prompt: "a metal lever door handle slowly pressing down from the other side, straining at its limit"}
    - {id: S05_D, covers: [7, 8], framing: "medium from passenger side", camera: "handheld, tense", refs: [DANIEL, TRUCK],
       prompt: "Daniel slams into the driver seat, hand on the door lock button, engine starting, breath fogging"}
    - {id: S05_E, covers: [9, 10], framing: "mirror insert", camera: "locked", refs: [TRUCK, FUEL],
       prompt: "the truck's side mirror: the store's glass entrance door swinging open, no person visible yet, the lot receding"}
    - {id: S05_F, covers: [11, 11], framing: "wide", camera: "slow pull-back", refs: [FUEL],
       prompt: "the brightly lit empty gas station from the dark road, rain, truck tail lights leaving frame"}
  overlays:
    - {style: rule, text: "RULE 1\nA lit building is not an open building.", in: "11", out: "11e+1.0"}
  sfx:
    - {cue: soup_can_roll, in: "3+0.2"}
    - {cue: handle_strain, in: "5", out: "6e"}
    - {cue: truck_door_close, in: "8"}
    - {cue: door_lock_thunk, in: "8+1.2"}
    - {cue: engine_rev, in: "8e"}
    - {cue: engine_idle_cab, in: "9", out: "11e"}

# ----------------------------------------------------------------------------- S06
- id: S06
  title: "Nothing broken"
  hud: {time: "2:16 AM"}
  music: {state: drone, intensity: 0.3}
  vo:
    - {t: "Half a mile on, three cars narrowed Main Street to a single lane."}
    - {t: "There was no wreck."}
    - {t: "No broken glass. No airbags. No steam rising from a radiator."}
    - {t: "One car had rolled to a stop with its front wheels against the curb. Another stood across the center line, its engine still running."}
    - {t: "A grocery bag had spilled oranges into the gutter."}
    - {t: "Daniel eased between them at walking speed, and that was when he noticed what the three cars had in common."}
    - {t: "Every driver's window was rolled all the way down.", p: 0.9}
    - {t: "In the last car, a child's rain jacket hung from the open rear door. He searched the sidewalks for a family."}
    - {t: "There was nobody to flag him down. Nobody asking for help."}
    - {t: "Rule two. When nothing is broken, ask why everyone left.", p: 1.0}
  shots:
    - {id: S06_A, covers: [1, 3], framing: "through windshield", camera: "slow creep forward", refs: [TRUCK],
       prompt: "three abandoned cars on a wet small-town main street leaving a single gap, intact bodies, hazard lights off, street lamps"}
    - {id: S06_B, covers: [4, 5], framing: "slow lateral pass", camera: "tracking at walking speed", refs: [],
       prompt: "a sedan with front wheels against the curb, a hatchback diagonal across the center line with exhaust vapor, oranges spilled from a paper grocery bag in the gutter"}
    - {id: S06_C, covers: [6, 7], framing: "detail montage", camera: "slow pans", refs: [],
       prompt: "three car driver windows each fully rolled down, rain falling into the interiors, empty seats"}
    - {id: S06_D, covers: [8, 8], framing: "close-up", camera: "locked", refs: [],
       prompt: "a small yellow child's rain jacket hanging from an open rear car door, swaying in the wind"}
    - {id: S06_E, covers: [9, 10], framing: "mirror insert", camera: "locked", refs: [TRUCK],
       prompt: "the side mirror shows empty wet sidewalks and the abandoned cars falling behind"}
  overlays:
    - {style: rule, text: "RULE 2\nWhen nothing is broken, ask why everyone left.", in: "10", out: "10e+1.0"}
  sfx:
    - {cue: engine_idle_cab, in: "1", out: "10e"}
    - {cue: tires_wet, in: "1", out: "10e", gain_db: -6}
    - {cue: hazard_tick, in: "4", out: "5e", note: "the running car's idle, heard only while passing it"}

# ----------------------------------------------------------------------------- S07
- id: S07
  title: "No signal"
  hud: {time: "2:18 AM", miles_to_exit: 3.8}
  music: {state: drone, intensity: 0.35}
  vo:
    - {t: "He called his dispatcher."}
    - {t: "The call connected, then dropped before he heard a voice."}
    - {t: "The second attempt didn't connect at all. One bar of signal. Then none."}
    - {t: "The route screen still showed the same calm blue line. Three point eight miles to the eastern edge of town, then open highway."}
    - {t: "He thought about turning around."}
    - {t: "Behind him were the empty cars, the gas station, and whatever had been standing behind that door."}
    - {t: "Ahead, Main Street ran straight and lit, with working traffic signals and nothing in the road."}
    - {t: "Daniel kept going."}
    - {t: "It wasn't courage."}
    - {t: "It was the oldest mistake people make in an emergency. Choosing the direction where nothing bad has happened yet.", p: 1.0}
  shots:
