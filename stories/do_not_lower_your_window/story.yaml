    - {cue: horn_tap, in: "6+0.5", note: "single short tap; everything except rain and engine ducks -12 dB for 4 s after"}

# ----------------------------------------------------------------------------- S09
- id: S09
  title: "The pattern"
  hud: {time: "2:25 AM", miles_to_exit: 2.4}
  music: {state: silent_then_pulse, intensity: 0.4, back_in_at: "4"}
  vo:
    - {t: "In the mirror, the woman stepped off the curb."}
    - {t: "She didn't cross. She walked into the lane the truck had just left, and followed it."}
    - {t: "Not running. Just walking, steadily, in the direction of the sound."}
    - {t: "Daniel reached over and turned off the radio."}
    - {t: "He thought of the ambulance. Lights, but no siren. Somebody in this town had already learned something."}
    - {t: "At the next corner, two men stood under an apartment awning, both facing the wall."}
    - {t: "He rolled past them with his foot barely on the pedal. No horn. No radio."}
    - {t: "Neither man turned."}
    - {t: "Daniel did not have a word for what was wrong with these people. But he understood the pattern well enough to obey it."}
    - {t: "Rule three. In a silent town, every sound is an announcement.", p: 1.0}
  shots:
    - {id: S09_A, covers: [1, 3], framing: "mirror insert", camera: "locked", refs: [WOMAN, TRUCK],
       prompt: "in the side mirror the woman walks into the empty lane behind the truck, steady, small and distant"}
    - {id: S09_B, covers: [4, 4], framing: "insert", camera: "locked", refs: [TRUCK],
       prompt: "a finger pressing the truck radio power knob, dashboard amber light"}
    - {id: S09_C, covers: [5, 5], framing: "close-up", camera: "slow push", refs: [DANIEL],
       prompt: "Daniel's face thinking, red-and-white light flicker reflected faintly in his eyes as a memory"}
    - {id: S09_D, covers: [6, 8], framing: "wide", camera: "slow tracking", refs: [TRUCK],
       prompt: "two men under an apartment awning facing the brick wall, backs to the street, the truck passes slowly in the foreground"}
    - {id: S09_E, covers: [9, 10], framing: "aerial wide", camera: "slow rise", refs: [TRUCK],
       prompt: "the lone truck on a dark grid of small-town streets, scattered still figures under streetlamps"}
  overlays:
    - {style: rule, text: "RULE 3\nIn a silent town, every sound is an announcement.", in: "10", out: "10e+1.0"}
  sfx:
    - {cue: radio_low_instrumental, in: "1", out: "4+0.6", gain_db: -20}
    - {cue: radio_click_off, in: "4+0.6", note: "after this the cab is dry: engine, rain, nothing else"}
    - {cue: engine_idle_cab, in: "1", out: "10e"}

# ----------------------------------------------------------------------------- S10
- id: S10
  title: "Vehicle screening"
  hud: {time: "2:29 AM", miles_to_exit: 1.7}
  music: {state: pulse, intensity: 0.4}
  vo:
    - {t: "At Main and Mill Street, a county health department van sat at an angle across one lane."}
    - {t: "Its rear doors were open."}
    - {t: "Daniel slowed almost to a stop."}
    - {t: "Inside, boxed face shields. Unopened protective suits. A folding chair. A cooler with a biohazard sticker."}
    - {t: "Taped to the inside of the rear door, in the full glare of his headlights, was a printed checklist. He could read the heading from the cab."}
    - {t: "Vehicle screening.", p: 0.7}
    - {t: "Below it, three steps. Driver window down. Temperature check. Destination."}
    - {t: "Beside the checklist hung a contact sheet. A long column of addresses."}
    - {t: "And next to nearly every one, the same two words in thick black marker."}
    - {t: "No response.", p: 0.9}
    - {t: "The handwriting looked familiar. Daniel couldn't place it."}
    - {t: "Not yet.", p: 0.8}
  shots:
    - {id: S10_A, covers: [1, 3], framing: "through windshield", camera: "slow creep", refs: [VAN, TRUCK],
       prompt: "a white health department van parked diagonally across an intersection lane, rear doors open, headlights washing over it"}
    - {id: S10_B, covers: [4, 4], framing: "slow pan", camera: "pan across cargo", refs: [VAN],
       prompt: "inside the van's cargo area: stacked face shields, sealed protective suits in plastic, a folding chair strapped to the wall, a cooler with a biohazard symbol"}
    - {id: S10_C, covers: [5, 7], framing: "insert", camera: "slow push", refs: [VAN],
       prompt: "a printed checklist sheet taped inside the open van door, BLANK paper (text added as overlay), headlight glare"}
    - {id: S10_D, covers: [8, 10], framing: "insert", camera: "slow tilt down", refs: [VAN],
       prompt: "a long contact sheet with ruled lines, a column of heavy black marker strokes beside the rows, BLANK paper (text as overlay)"}
    - {id: S10_E, covers: [11, 12], framing: "close-up", camera: "locked", refs: [DANIEL],
       prompt: "Daniel's eyes narrowing, a flicker of recognition, headlight bounce on his face"}
  overlays:
    - {style: printed, text: "VEHICLE SCREENING\n1. Driver window down\n2. Temperature check\n3. Destination", in: "5+1.5", out: "7e+0.4", anchor_shot: S10_C}
    - {style: marker, text: "NO RESPONSE  ×14", in: "9", out: "10e+0.6", anchor_shot: S10_D, note: "repeat the marker phrase down the column; same hand font as S02"}
