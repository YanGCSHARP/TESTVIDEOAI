# ----------------------------------------------------------------------------- S14
- id: S14
  title: "The mask"
  hud: {time: "2:42 AM", miles_to_exit: 0.4}
  music: {state: drone_narrow, intensity: 0.5}
  vo:
    - {t: "Up close, the mask wasn't wet from the rain."}
    - {t: "A dark stain had spread outward from the center of it. From the inside."}
    - {t: "Above the collar of the suit, thin dark lines branched across the skin of his neck, like cracks under ice."}
    - {t: "And his eyes were wrong. Not glowing. Not red. Just clouded, like a window someone had breathed on."}
    - {t: "They weren't looking at Daniel's face. They were following his hands.", p: 0.9}
    - {t: "Then the phone in the dash mount lit up and began to ring.", p: 0.5}
    - {t: "Twenty-four minutes late, his dispatcher was calling back."}
    - {t: "The man's head snapped toward the sound."}
    - {t: "His hand dropped to the door handle. He pulled once. Waited. Pulled again, harder, until the whole door shook in its frame."}
    - {t: "Daniel killed the ringer. It was already too late."}
    - {t: "Behind the gate, every door of the van and the SUV stood open.", p: 0.8}
  shots:
    - {id: S14_A, covers: [1, 3], framing: "close-up through glass", camera: "slow push", refs: [WORKER],
       prompt: "REVEAL: the worker's mask with a dark stain spreading from its center, thin dark branching lines on his neck above the coverall collar"}
    - {id: S14_B, covers: [4, 5], framing: "extreme close-up", camera: "locked", refs: [WORKER],
       prompt: "clouded milky eyes behind clear goggles, not glowing, pupils barely visible, tracking slowly to one side"}
    - {id: S14_C, covers: [6, 7], framing: "insert", camera: "locked", refs: [TRUCK],
       prompt: "the phone in the dash mount lights up bright white in the dark cab (caller UI added as overlay)"}
    - {id: S14_D, covers: [8, 9], framing: "exterior close", camera: "locked, door shakes", refs: [WORKER, TRUCK],
