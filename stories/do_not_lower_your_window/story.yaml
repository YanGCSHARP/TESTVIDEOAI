# ----------------------------------------------------------------------------- S12
- id: S12
  title: "The checkpoint"
  hud: {time: "2:38 AM", miles_to_exit: 0.4}
  music: {state: relief_thin, intensity: 0.25, note: "brief loosening, never triumphant"}
  vo:
    - {t: "The eastern exit appeared beyond a row of dark houses."}
    - {t: "Two light towers turned the road white."}
    - {t: "Concrete barriers funneled both lanes into one. Behind a lowered gate stood a white utility van and a dark SUV."}
    - {t: "And beside the gate, a man in a white protective suit."}
    - {t: "He raised one arm.", p: 0.6}
    - {t: "Stop.", p: 0.9}
    - {t: "Daniel felt his chest loosen for the first time since the gas station."}
    - {t: "Someone was still working. Someone in this town still had a job, and a procedure, and a reason to be standing in the rain."}
    - {t: "Four tenths of a mile to open highway, on the other side of that gate."}
    - {t: "He stopped on the gravel turnout, well short of the barrier, and left the engine running."}
    - {t: "He even left himself room to back up. Not because he expected to need it. Habit.", p: 0.8}
  shots:
